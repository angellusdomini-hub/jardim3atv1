<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Caminhos do Jardim · Infantil 5</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f7f1;color:#234b43;font:18px 'Trebuchet MS',Arial;letter-spacing:0}button{font:inherit;font-weight:bold;border:0;border-radius:8px;padding:12px 18px;cursor:pointer;background:#e0ebe3;color:#244f45;box-shadow:0 3px 0 #bdcec0}button:hover{filter:brightness(.96)}button:disabled{opacity:.4;cursor:default}main{height:100dvh;display:grid;grid-template-rows:65px auto 1fr 60px;gap:12px;padding:16px 26px;max-width:1450px;margin:auto}header,footer{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:28px;margin:0}small{font-size:14px;color:#708679}.instruction{font-size:23px;font-weight:bold;text-align:center;background:white;padding:12px;border-radius:8px;border:1px solid #d8e4d7}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;min-height:0}.garden{position:relative;min-height:0;background:#dbeedb;border:2px solid #aecdad;border-radius:8px;display:flex;align-items:center;justify-content:center}.board{height:min(100%,480px);aspect-ratio:1;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:16px}.cell{display:grid;place-items:center;position:relative;background:#fffdf2;border:1px solid #d7dec8;border-radius:6px;box-shadow:0 3px 0 #bfd0af;min-height:0}.cell svg{width:75%;height:75%;z-index:2}.wall{background:#80ae79;border-color:#6a9a65;box-shadow:0 3px 0 #5e8c58}.wall:after{content:'✿';color:#b6d9a3;font-size:32px}.trailA{background:#d4e7fd}.trailB{background:#ffe1cf}.trailBoth{background:linear-gradient(135deg,#d4e7fd 50%,#ffe1cf 50%)}.visit{position:absolute;bottom:3px;right:5px;font-size:12px;color:#5078a4}.goal{outline:3px solid #e8bc43;outline-offset:-3px}.side{display:flex;flex-direction:column;gap:13px;min-height:0;justify-content:center}.routeLabel{font-size:24px;font-weight:bold}.count{font-size:45px;font-weight:bold;color:#386eab}.dots{display:flex;gap:4px;flex-wrap:wrap;max-height:60px;overflow:hidden}.dot{width:13px;height:13px;border-radius:50%;background:#5896d8}.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:260px}.pad button{font-size:37px;background:white;border:1px solid #cbdbcd;padding:5px;min-height:55px}.tools{display:flex;gap:9px}.tools button{font-size:16px;flex:1}.message{min-height:45px;font-size:18px;line-height:1.4}.primary{background:#efbd47;color:#594316;box-shadow:0 3px 0 #c99b31}.blue{background:#cfe3fa;color:#305f98}.orange{background:#ffdfc5;color:#986035}#overlay{position:fixed;inset:0;z-index:5;background:#f2f7f1;display:grid;place-items:center;padding:20px}.intro{max-width:780px;text-align:center}.intro h1{font-size:45px;line-height:1.05;margin:15px 0}.intro svg{width:130px;height:130px}.intro p{font-size:22px;line-height:1.5;color:#69816d}.hidden{display:none!important}.compare{position:absolute;inset:0;background:#f2f7f1;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:16px}.compare h2{margin:0;font-size:27px}.maps{display:grid;grid-template-columns:1fr 1fr;gap:24px;width:min(100%,720px)}.map{text-align:center}.miniBoard{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;aspect-ratio:1;max-height:250px;margin:auto}.miniBoard .wall:after{font-size:19px}.choices{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.result{min-height:30px;font-size:20px;text-align:center}.map strong{font-size:23px;display:block;padding:6px}.legend{font-size:15px;color:#6e8471}details{font-size:16px;line-height:1.6;text-align:left;max-width:750px}footer{border-top:1px solid #d4e0d0;padding-top:10px}#next{white-space:nowrap}@media(max-height:720px){main{padding:10px 20px;gap:8px;grid-template-rows:53px auto 1fr 48px}.instruction{font-size:20px;padding:9px}.board{padding:12px;gap:5px}.side{gap:8px}.pad button{min-height:44px;font-size:31px}.count{font-size:34px}.miniBoard{max-height:190px}.compare{gap:9px}.compare h2{font-size:23px}}@media(max-width:800px){.workspace{grid-template-columns:1fr 200px;gap:10px}main{padding:10px}h1{font-size:22px}.instruction{font-size:18px}.pad button{padding:4px;font-size:28px}.routeLabel{font-size:20px}.message{font-size:16px}.tools{flex-wrap:wrap}.maps{gap:10px}}
</style></head><body>
<main><header><div><h1>Caminhos do Jardim</h1><small>Universitas · Infantil 5</small></div><b id="level">Jardim 1 de 5</b></header><div class="instruction" id="instruction">Leve o carrinho até a flor.</div><section class="workspace"><div class="garden"><div class="board" id="board"></div><section id="comparison" class="compare hidden"></section></div><aside class="side"><div class="routeLabel" id="routeLabel">Caminho azul</div><div><span class="count" id="count">0</span> passos</div><div class="dots" id="dots"></div><div class="pad"><span></span><button data-dir="U" title="Cima">↑</button><span></span><button data-dir="L" title="Esquerda">←</button><button data-dir="D" title="Baixo">↓</button><button data-dir="R" title="Direita">→</button></div><div class="tools"><button id="undo" title="Voltar um passo">↶ Voltar</button><button id="reset">↺ Recomeçar</button></div><div id="message" class="message" aria-live="polite"></div><span class="legend">Cada seta move uma casinha.</span></aside></section><footer><button id="hear">Ouvir missão</button><span id="progress">Dois caminhos, uma descoberta!</span><button id="next" class="primary" disabled>Próximo jardim →</button></footer></main>
<section id="overlay"><div class="intro" id="intro"></div></section>
<script>
const $=id=>document.getElementById(id),dirs={U:[0,-1],D:[0,1],L:[-1,0],R:[1,0]};
const flower='<svg viewBox="0 0 100 100" aria-label="Flor" role="img"><path d="M50 58V94M50 81Q26 59 23 77Q28 93 50 87" fill="#76af68" stroke="#558f50" stroke-width="4"/><g fill="#ee927f" stroke="#d67b6b" stroke-width="2"><ellipse cx="50" cy="24" rx="14" ry="21"/><ellipse cx="50" cy="24" rx="14" ry="21" transform="rotate(72 50 43)"/><ellipse cx="50" cy="24" rx="14" ry="21" transform="rotate(144 50 43)"/><ellipse cx="50" cy="24" rx="14" ry="21" transform="rotate(216 50 43)"/><ellipse cx="50" cy="24" rx="14" ry="21" transform="rotate(288 50 43)"/></g><circle cx="50" cy="43" r="14" fill="#f5d363"/></svg>';
const car='<svg viewBox="0 0 100 100" role="img" aria-label="Carrinho"><rect x="13" y="39" width="74" height="37" rx="9" fill="#518ed0"/><path d="M27 40L37 20H65L77 40" fill="#6da9e3"/><path d="M40 24H61L69 39H33Z" fill="#def2ff"/><circle cx="31" cy="77" r="12" fill="#3b526b"/><circle cx="72" cy="77" r="12" fill="#3b526b"/><circle cx="31" cy="77" r="5" fill="#dee7ed"/><circle cx="72" cy="77" r="5" fill="#dee7ed"/><rect x="77" y="47" width="10" height="9" rx="3" fill="#ffe28a"/></svg>';
const levels=[{walls:[[2,1],[2,2],[2,3]],goal:[4,4]},{walls:[[1,1],[2,1],[3,3]],goal:[4,3]},{walls:[[1,0],[1,1],[3,2],[3,3]],goal:[4,4]},{walls:[[2,0],[2,1],[1,3],[3,3]],goal:[4,2]},{walls:[[1,1],[2,1],[3,1],[1,3],[2,3]],goal:[4,4]}];
let stage=0,route=0,paths=[[[0,0]],[]],arrived=false,review=false,answered=false,discoveries=0;
function key(p){return p.join(',')}function message(s){$('message').textContent=s}function speak(s){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s||$('instruction').textContent);u.lang='pt-BR';speechSynthesis.speak(u)}}$('hear').onclick=()=>speak();
$('intro').innerHTML=flower+'<h1>Caminhos do Jardim</h1><p>Um carrinho. Uma flor.<br>Vamos descobrir dois caminhos?</p><button class="primary" id="start">Vamos brincar →</button><p class="legend">Cinco jardins para explorar e comparar.</p>';$('start').onclick=()=>{$('overlay').classList.add('hidden');load()};
function load(){route=0;paths=[[[0,0]],[]];arrived=false;review=false;answered=false;$('comparison').classList.add('hidden');$('next').disabled=true;$('level').textContent='Jardim '+(stage+1)+' de 5';$('instruction').textContent='Faça seu primeiro caminho até a flor.';message('Use as setas. Desvie das cercas verdes.');draw()}
function map(path,mini=false){let grid=document.createElement('div');grid.className=mini?'miniBoard':'board';for(let y=0;y<5;y++)for(let x=0;x<5;x++){let p=[x,y],c=document.createElement('div');c.className='cell';if(levels[stage].walls.some(w=>key(w)===key(p)))c.classList.add('wall');let a=paths[0].some(w=>key(w)===key(p)),b=paths[1].some(w=>key(w)===key(p));if(mini){if(path.some(w=>key(w)===key(p)))c.classList.add(path===paths[0]?'trailA':'trailB')}else if(a||b)c.classList.add(a&&b?'trailBoth':a?'trailA':'trailB');if(key(levels[stage].goal)===key(p)){c.classList.add('goal');c.innerHTML=flower}if(mini?key(p)==='0,0':key(path.at(-1))===key(p))c.innerHTML=car;grid.append(c)}return grid}
function draw(){let path=paths[route];$('board').replaceChildren(...map(path).children);$('count').textContent=path.length-1;$('count').style.color=route?'#c57843':'#386eab';$('routeLabel').textContent=route?'Caminho laranja':'Caminho azul';$('dots').innerHTML=path.slice(1).map(()=>'<span class="dot" style="background:'+(route?'#e59a61':'#5896d8')+'"></span>').join('');$('undo').disabled=path.length<2||review;$('reset').disabled=review;document.querySelectorAll('[data-dir]').forEach(b=>b.disabled=review)}
function move(a){if(review||arrived||!$('overlay').classList.contains('hidden'))return;let path=paths[route],last=path.at(-1),d=dirs[a],next=[last[0]+d[0],last[1]+d[1]];if(next.some(n=>n<0||n>4)||levels[stage].walls.some(w=>key(w)===key(next))){message('Tem uma cerca aqui. Experimente outra direção.');return}if(path.length>=41){message('Vamos recomeçar e procurar um caminho menor?');return}path.push(next);message('');draw();if(key(next)===key(levels[stage].goal)){arrived=true;if(route===0){$('instruction').textContent='Você chegou! Agora descubra outro caminho.';message('Guarde o azul e comece o laranja.');$('next').textContent='Fazer caminho laranja →';$('next').disabled=false}else if(JSON.stringify(paths[0])===JSON.stringify(paths[1])){arrived=false;message('Foi o mesmo caminho. Volte algumas casas e experimente outra rota.')}else compare()}}
document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>move(b.dataset.dir));document.onkeydown=e=>{let a={ArrowUp:'U',ArrowDown:'D',ArrowLeft:'L',ArrowRight:'R'}[e.key];if(a){e.preventDefault();move(a)}};$('undo').onclick=()=>{if(paths[route].length>1){paths[route].pop();arrived=false;$('next').disabled=true;draw();message('Você pode escolher outra direção.')}};$('reset').onclick=()=>{paths[route]=[[0,0]];arrived=false;$('next').disabled=true;draw();message('Vamos tentar por outro lugar.')} ;
function compare(){review=true;answered=false;$('instruction').textContent='Compare: qual caminho teve menos passos?';let c=$('comparison');c.innerHTML='<h2>Dois caminhos para a mesma flor</h2><div class="maps"></div><div class="choices"></div><div class="result" id="answer" aria-live="polite"></div>';paths.forEach((p,i)=>{let card=document.createElement('div');card.className='map';card.innerHTML='<strong style="color:'+(i?'#bd743e':'#386eab')+'">'+(i?'Laranja':'Azul')+' · '+(p.length-1)+' passos</strong>';card.append(map(p,true));c.querySelector('.maps').append(card)});['Azul','Laranja','Mesmo tamanho'].forEach((s,i)=>{let b=document.createElement('button');b.className=i===0?'blue':i===1?'orange':'';b.textContent=s;b.onclick=()=>{if(answered)return;let a=paths[0].length,bn=paths[1].length,correct=a===bn?2:a<bn?0:1;if(i===correct){answered=true;discoveries++;$('answer').textContent='Muito bem! Os dois chegaram. Você comparou os passos.';$('next').disabled=false}else $('answer').textContent='Vamos contar os passos e comparar de novo.'};c.querySelector('.choices').append(b)});c.classList.remove('hidden');$('next').textContent=stage===4?'Concluir →':'Próximo jardim →';$('next').disabled=true;message('Olhe as duas rotas e conte os passos.');draw()}
$('next').onclick=()=>{if(!route&&!review){route=1;paths[1]=[[0,0]];arrived=false;$('instruction').textContent='Encontre um caminho diferente até a flor.';$('next').disabled=true;$('next').textContent='Próximo jardim →';message('O caminho azul fica marcado. Experimente outra rota.');draw()}else if(answered){stage++;if(stage<5)load();else finish()}};
function finish(){$('overlay').classList.remove('hidden');$('intro').innerHTML=flower+'<h1>Muito bem!</h1><p>Você explorou 5 jardins,<br>fez 10 caminhos e comparou as rotas.</p><p>★ '+discoveries+' descobertas ★</p><button class="primary" id="again">Explorar novamente →</button><details><summary>Para o professor · aula de 40 minutos</summary>5 min: apresentar carrinho, flor e setas. 25 min: explorar cinco jardins, criando duas rotas por jardim. 7 min: crianças explicam seus caminhos e comparam passos. 3 min: fechamento. Pergunte: “Os dois chegaram?”, “Qual deu mais voltas?”, “Caminhos diferentes podem ter o mesmo tamanho?”. Observe o planejamento, a exploração de alternativas e a comparação. O caminho com mais passos também é uma solução válida. Atividade plugada para Infantil 5, com mediação oral e sem cobrança de velocidade.</details>';$('again').onclick=()=>{stage=0;discoveries=0;$('overlay').classList.add('hidden');load()}}
// Extra gardens keep the perimeter open, ensuring two distinct valid routes.
for(let n=5;n<15;n++){let blocks=[];for(let y=1;y<4;y++)for(let x=1;x<4;x++)if(((x*5+y*7+n*3)%7)<3)blocks.push([x,y]);levels.push({walls:blocks,goal:[4,4]})}
const baseLoad=load,baseMap=map;let stopover=null,stopVisited=false;
load=function(){baseLoad();$('level').textContent='JARDIM '+(stage+1)+' / 15';$('progress').textContent=['EXPLORAR · 1–5','COMPARAR · 6–10','PLANEJAR · 11–15'][Math.floor(stage/5)];stopover=stage>=10?[4,0]:null;stopVisited=false;$('instruction').textContent=stopover?'Passe pela estrela antes de chegar à flor.':stage>=5?'Experimente dois caminhos e compare os passos.':'Leve o carrinho até a flor.';draw();$('next').textContent='Próximo jardim →'};
map=function(path,mini=false){let g=baseMap(path,mini);if(stopover){let c=g.children[stopover[1]*5+stopover[0]];if(key(path.at(-1))!==key(stopover)){let marker=document.createElement('span');marker.textContent='★';marker.className='starMarker';c.append(marker)}}return g};
const baseMove=move;move=function(a){if(stopover&&!review&&!arrived&&$('overlay').classList.contains('hidden')){let path=paths[route],last=path.at(-1),d=dirs[a],next=[last[0]+d[0],last[1]+d[1]];if(key(next)===key(levels[stage].goal)&&!path.some(p=>key(p)===key(stopover))){message('Visite a estrela primeiro. Depois procure a flor.');return}}baseMove(a)};
compare=function(){review=true;answered=false;let more=stage>=5&&stage%2===1;$('instruction').textContent=more?'Qual caminho teve MAIS passos?':'Qual caminho teve MENOS passos?';let c=$('comparison');c.innerHTML='<h2>Vamos comparar os caminhos?</h2><div class="maps"></div><div class="choices"></div><div class="result" id="answer" aria-live="polite"></div>';paths.forEach((p,i)=>{let card=document.createElement('div');card.className='map';card.innerHTML='<strong>'+(i?'LARANJA':'AZUL')+' · '+(p.length-1)+' passos</strong>';card.append(map(p,true));c.querySelector('.maps').append(card)});['Azul','Laranja','Iguais'].forEach((s,i)=>{let b=document.createElement('button');b.className=i===0?'blue':i===1?'orange':'';b.textContent=s;b.onclick=()=>{if(answered)return;let a=paths[0].length,z=paths[1].length,correct=a===z?2:more?(a>z?0:1):(a<z?0:1);if(i===correct){answered=true;discoveries++;$('answer').textContent='Isso! Compare também por onde cada caminho passou.';$('next').disabled=false}else $('answer').textContent='Conte as casinhas de cada caminho. Vamos tentar de novo.'};c.querySelector('.choices').append(b)});c.classList.remove('hidden');$('next').disabled=true;$('next').textContent=stage===14?'Concluir →':'Próximo jardim →';draw()};
$('next').onclick=()=>{if(!route&&!review){route=1;paths[1]=[[0,0]];arrived=false;$('instruction').textContent=stopover?'Crie outra rota, passando pela estrela.':'Encontre um caminho diferente até a flor.';$('next').disabled=true;message('O azul fica marcado para você comparar.');draw()}else if(answered){stage++;if(stage<levels.length)load();else finish()}};
finish=function(){$('overlay').classList.remove('hidden');$('intro').innerHTML=flower+'<h1>Você descobriu novos caminhos!</h1><p>15 jardins · 30 rotas exploradas<br>'+discoveries+' comparações concluídas</p><button id="again" class="primary">Explorar novamente →</button><details><summary>Orientação para a aula de 40 minutos</summary>4 minutos para demonstrar as setas e a comparação. 10 minutos nos jardins 1–5: exploração de duas rotas. 10 minutos nos jardins 6–10: comparar mais, menos e igual. 12 minutos nos jardins 11–15: planejar a passagem pela estrela e executar duas rotas. 4 minutos de conversa: por onde você passou? Qual rota teve mais passos? A duração depende do ritmo da turma; use a conversa e a exploração em duplas como parte da aprendizagem. Não é necessário que todas as crianças concluam as 15 fases.</details>';$('again').onclick=()=>{stage=0;discoveries=0;$('overlay').classList.add('hidden');load()}};
$('intro').innerHTML='<div class="introBrand">UNIVERSITAS · INFANTIL 5</div>'+flower+'<h1>Jardim dos<br>Caminhos</h1><p>Explore. Descubra. Compare.</p><div class="introBadges"><span>15 jardins</span><span>30 caminhos</span><span>Novas descobertas</span></div><button class="primary" id="start">Vamos explorar →</button>';$('start').onclick=()=>{$('overlay').classList.add('hidden');load()};document.title='Jardim dos Caminhos · 15 jardins';document.querySelector('header h1').textContent='Jardim dos Caminhos';
</script>
<style>
body{background:#fff9ef;color:#274b49;font-family:'Trebuchet MS',Arial,sans-serif}main{padding:16px 26px;gap:12px;grid-template-rows:65px auto minmax(0,1fr) 56px}header{border-bottom:2px solid #efe3cc;padding-bottom:10px}h1{font-size:29px}header small{font-size:12px;color:#9b937f}#level{font-size:14px;background:#f8dd8c;padding:10px 15px;border-radius:6px;color:#75591e}.instruction{background:transparent;border:0;padding:7px;font-size:25px;color:#315e55}.workspace{grid-template-columns:minmax(0,1fr) 280px;gap:22px}.garden{background:#b6d6b1;border:3px solid #83ac7c;box-shadow:0 7px 0 #759c6e;border-radius:8px}.board{height:min(100%,510px);gap:7px;padding:17px}.cell{background:#fff9e5;border:1px solid #d6cda6;box-shadow:0 4px 0 #9bae83;border-radius:6px}.wall{background:#588e64;border-color:#4e8058;box-shadow:0 4px 0 #3c6846}.wall:after{color:#99c887;font-size:36px}.goal{outline-color:#e8b948;background:#fff0b5}.trailA{background:#badcf5}.trailB{background:#ffd0af}.trailBoth{background:linear-gradient(135deg,#badcf5 50%,#ffd0af 50%)}.side{background:#fffdf7;border:2px solid #eee0c3;border-radius:8px;padding:20px;gap:14px;box-shadow:0 5px 0 #e5d7b9}.routeLabel{font-size:23px;color:#3e6d65}.count{font-size:51px}.pad{gap:9px}.pad button{background:#dcecf4;color:#3e6c8c;border:1px solid #b3cdda;box-shadow:0 4px 0 #9bb8c8;font-size:38px}.tools button{font-size:14px;background:#f3eddf;box-shadow:0 3px 0 #d9d0bc;padding:10px}.primary{background:#e68260;border:1px solid #c46a4b;color:white;box-shadow:0 4px 0 #b85c40}.message{color:#8c7a58;font-size:17px}.dot{box-shadow:0 2px 0 #0001}.legend{font-size:13px;color:#a49a83}footer{border:0}#hear{background:#e7eddb;box-shadow:0 3px 0 #c7d2b8;font-size:15px}#progress{font-size:12px;color:#9a8d73;font-weight:bold}.compare{background:#fff9ef;border-radius:6px;gap:16px}.map strong{font-size:20px;color:#476f67}.miniBoard .cell{box-shadow:0 2px 0 #d0d9bf}.miniBoard .wall{box-shadow:0 2px 0 #496e4b}.choices button{min-width:125px;border:1px solid #d8d4c4;background:#f1eee3;box-shadow:0 3px 0 #d1ccbb}.choices .blue{background:#c6e0f7;color:#3c6a91;border-color:#a1c2df;box-shadow:0 3px 0 #94b7d6}.choices .orange{background:#ffd7ba;color:#a5653c;border-color:#e6b591;box-shadow:0 3px 0 #d8a781}.starMarker{position:absolute;font-size:30px;color:#d79b19;z-index:3;text-shadow:0 2px white}#overlay{background:#fff9ef}.intro{max-width:900px;width:100%;position:relative}.introBrand{font-size:13px;color:#9e8b62;letter-spacing:2px;font-weight:bold;margin-bottom:14px}.intro>svg{width:145px;height:145px;filter:drop-shadow(0 8px 0 #e9dfc3)}.intro h1{font-size:65px;line-height:.95;color:#39715b;margin:18px 0}.intro p{font-size:23px;color:#9b8e70;margin:15px 0}.introBadges{display:flex;justify-content:center;gap:12px;margin:22px 0 30px}.introBadges span{font-size:14px;padding:9px 14px;background:#e2edda;color:#64815a;border-radius:5px}.introBadges span:nth-child(2){background:#fbe8b0;color:#9c8035}.introBadges span:nth-child(3){background:#f8d9c9;color:#af795f}.intro .primary{padding:15px 30px;font-size:21px}@media(max-height:720px){main{grid-template-rows:50px auto minmax(0,1fr) 46px;padding:10px 20px;gap:8px}.instruction{font-size:21px;padding:4px}.side{padding:14px;gap:8px}.count{font-size:37px}.pad button{font-size:31px}.board{padding:12px;gap:5px}.intro>svg{width:110px;height:110px}.intro h1{font-size:52px}.introBadges{margin:14px 0 22px}.compare{gap:9px}.miniBoard{max-height:185px}}@media(max-width:800px){.workspace{grid-template-columns:1fr 200px;gap:12px}.side{padding:12px}.routeLabel{font-size:19px}h1{font-size:23px}.instruction{font-size:19px}.intro h1{font-size:49px}}
</style></body></html>
