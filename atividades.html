<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Universitas · Atividades de Computação</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f7f9;color:#284b58;font:18px 'Trebuchet MS',Arial,sans-serif;letter-spacing:0}header{padding:22px 7%;border-bottom:1px solid #d7e3e8;background:white;font-weight:bold;font-size:20px}main{max-width:800px;margin:8vh auto;padding:25px}small{color:#6b8a94;font-size:13px;font-weight:bold}h1{font-size:43px;line-height:1.1;margin:16px 0 30px}label{display:block;font-weight:bold;margin-bottom:10px}select{width:100%;padding:17px;font:inherit;color:#284b58;background:white;border:2px solid #b4cdd4;border-radius:8px;cursor:pointer}section{margin:25px 0;display:grid;grid-template-columns:72px 1fr;gap:20px;align-items:center;border-top:1px solid #d7e3e8;border-bottom:1px solid #d7e3e8;padding:25px 0;min-height:150px}.symbol{display:grid;place-items:center;width:72px;height:72px;background:#dcebdd;color:#55876d;border-radius:8px;font-size:40px}h2{font-size:25px;margin:0 0 8px}p{color:#6b858e;line-height:1.5;margin:0}button{background:#347e85;color:white;border:0;border-radius:8px;padding:16px 25px;font:inherit;font-weight:bold;cursor:pointer}button:hover{background:#28676d}@media(max-width:600px){main{margin:3vh auto;padding:22px}h1{font-size:34px}section{grid-template-columns:55px 1fr;gap:15px}.symbol{width:55px;height:55px;font-size:30px}h2{font-size:22px}}
</style></head><body><header>UNIVERSITAS</header><main><small>EDUCAÇÃO DIGITAL E COMPUTAÇÃO</small><h1>Uma nova descoberta<br>a cada atividade.</h1><form id="choose"><label for="class">Escolha a turma</label><select id="class" name="turma"><option value="infantil">Infantil 5 / Jardim III</option><option value="primeiro">1º ano do Ensino Fundamental</option></select><section aria-live="polite"><div class="symbol" id="icon">✿</div><div><h2 id="title">Jardim dos Caminhos</h2><p id="description">Explore os labirintos, experimente duas rotas e compare os caminhos.</p></div></section><button type="submit">Abrir atividade →</button></form></main><script>
const activities={infantil:{title:'Jardim dos Caminhos',description:'Explore os labirintos, experimente duas rotas e compare os caminhos.',icon:'✿',file:'labirinto_infantil5_duas_rotas.html'},primeiro:{title:'Ilha das Invenções',description:'Planeje rotas, recolha peças, corrija comandos e registre suas descobertas com o teclado.',icon:'⚑',file:'primeiro_ano_ilha_das_invencoes.html'}};const select=document.getElementById('class');select.onchange=()=>{let a=activities[select.value];document.getElementById('title').textContent=a.title;document.getElementById('description').textContent=a.description;document.getElementById('icon').textContent=a.icon};document.getElementById('choose').onsubmit=e=>{e.preventDefault();location.href=activities[select.value].file};
</script></body></html>
